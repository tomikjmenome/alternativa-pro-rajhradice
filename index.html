<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Alternativa pro Rajhradice – web připravujeme</title>
  <meta name="description" content="Alternativa pro Rajhradice – komunální volby 2026. Web připravujeme.">
  <link rel="icon" href="assets/img/Icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #f2ebe1; --dark: #24252d; --dark-2: #2f313b; --brick: #e2694a; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 40%, var(--dark-2) 0%, var(--dark) 70%);
      color: var(--cream);
      font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 640px; width: 100%; }
    .logo { width: min(100%, 520px); height: auto; display: block; margin: 0 auto 36px; }
    h1 { font-size: clamp(22px, 4vw, 32px); font-weight: 700; margin: 0 0 12px; letter-spacing: .02em; }
    p { font-size: clamp(15px, 2.2vw, 18px); font-weight: 500; margin: 0; opacity: .85; }
    .line { width: 56px; height: 4px; background: var(--brick); margin: 28px auto 0; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/img/normal-darkBG.svg" alt="Alternativa pro Rajhradice">
    <h1>Web připravujeme</h1>
    <p>Komunální volby 2026 · Rajhradice</p>
    <div class="line" aria-hidden="true"></div>
  </main>
</body>
</html>
